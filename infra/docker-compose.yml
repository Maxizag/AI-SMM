services:
  postgres:
    image: postgres:16
    container_name: aismm-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aismm}
      POSTGRES_USER: ${POSTGRES_USER:-aismm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aismm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aismm-network

  redis:
    image: redis:7
    container_name: aismm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aismm-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: aismm-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:6333/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - aismm-network

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: aismm-api
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-aismm}
      - POSTGRES_USER=${POSTGRES_USER:-aismm}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-devpass}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-changeme}
      - ENV=${ENV:-dev}
    volumes:
      - ../api:/app
      - ../migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aismm-network

  workers:
    build:
      context: ../workers
      dockerfile: Dockerfile
    container_name: aismm-workers
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-aismm}
      - POSTGRES_USER=${POSTGRES_USER:-aismm}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-devpass}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ENV=${ENV:-dev}
    volumes:
      - ../workers:/app
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - aismm-network

  bot:
    build:
      context: ../bot
      dockerfile: Dockerfile
    container_name: aismm-bot
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-aismm}
      - POSTGRES_USER=${POSTGRES_USER:-aismm}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-devpass}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ENV=${ENV:-dev}
    volumes:
      - ../bot:/app
    depends_on:
      postgres:
        condition: service_started
      api:
        condition: service_started
    restart: unless-stopped
    networks:
      - aismm-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local

networks:
  aismm-network:
    driver: bridge
